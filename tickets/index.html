<style>
  :root { --rojo:#B3282D; --gris:#f4f4f5; --borde:#e4e4e7; --txt:#18181b; --txt2:#71717a; --azul:#1f4e79; }

  [hidden] { display:none !important; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--gris); color:var(--txt); min-height:100vh; display:flex; flex-direction:column; }
  header { background:var(--rojo); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header h1 { font-size:18px; font-weight:800; letter-spacing:.2px; } header h1 a { color:#fff; text-decoration:none; opacity:.85; font-weight:600; }
  header .s { font-size:12px; opacity:.9; text-align:right; }
  header button { background:rgba(255,255,255,.18); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; margin-left:8px; }

  .login { text-align:center; padding-top:70px; } .login .ico { font-size:46px; } .login h2 { font-size:22px; margin:10px 0 4px; } .login p { color:var(--txt2); margin-bottom:20px; }
  .msg { text-align:center; color:var(--txt2); padding:60px 0; } .msg a { color:var(--rojo); font-weight:700; text-decoration:none; }

  .barra h2 { font-size:24px; font-weight:800; } .barra p { color:var(--txt2); margin-top:4px; font-size:14.5px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid transparent; border-radius:10px; padding:9px 16px; font:inherit; font-size:14.5px; font-weight:700; cursor:pointer; text-decoration:none; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn-rojo { background:var(--rojo); color:#fff; } .btn-azul { background:var(--azul); color:#fff; }
  .btn-claro { background:#fff; color:var(--txt); border-color:#d4d4d8; } .btn-peligro { background:#fff; color:#8C1F1B; border-color:#F2B8B3; }
  .filtros { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }

  .hoja { background:#fff; border:1px solid var(--borde); border-radius:12px; overflow-x:auto; }
  .hoja table { border-collapse:collapse; width:100%; font-size:14px; }
  .hoja th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--txt2); background:#fafafa; padding:9px 12px; border-bottom:1px solid var(--borde); white-space:nowrap; }
  .hoja td { padding:10px 12px; border-top:1px solid var(--borde); vertical-align:top; }
  .hoja tbody tr { cursor:pointer; } .hoja tbody tr:hover { background:#fafafa; }
  .hoja td.num { font-variant-numeric:tabular-nums; color:var(--txt2); white-space:nowrap; } .hoja td.tit { font-weight:700; min-width:220px; }
  .hoja td.chico { font-size:13px; color:#3f3f46; white-space:nowrap; }
  .vacio { padding:36px 16px; text-align:center; color:var(--txt2); }
  .chip { display:inline-block; font-size:11.5px; font-weight:700; border-radius:99px; padding:2px 8px; white-space:nowrap; }
  .e-nuevo { background:#FEF9C3; color:#713F12; } .e-aceptado { background:#E0ECF8; color:#1f4e79; } .e-rechazado { background:#FCE7E5; color:#8C1F1B; }
  .e-en_proceso { background:#FFF4ED; color:#9A3412; } .e-publicado { background:#E3F3E8; color:#1E5A36; } .e-cerrado { background:var(--gris); color:var(--txt2); }
  .p-alta { background:#FCE7E5; color:#8C1F1B; } .p-media { background:#FFF4ED; color:#9A3412; } .p-baja { background:var(--gris); color:var(--txt2); }
  .modal { position:fixed; inset:0; background:rgba(24,24,27,.55); display:flex; align-items:flex-start; justify-content:center; padding:5vh 14px; overflow-y:auto; z-index:20; }
  #conf { z-index:30; }
  .caja { background:#fff; border-radius:16px; width:100%; max-width:720px; padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.25); }
  .caja.chica { max-width:480px; }
  .caja h3 { font-size:19px; font-weight:800; margin-bottom:4px; } .caja .sub { color:var(--txt2); font-size:13.5px; margin-bottom:14px; }
  .campo { margin-bottom:12px; } .campo label { display:block; font-size:13px; font-weight:700; margin-bottom:4px; }
  .campo input, .campo select, .campo textarea { width:100%; border:1px solid #d4d4d8; border-radius:10px; padding:9px 11px; font:inherit; font-size:14.5px; background:#fff; }
  .campo textarea { min-height:96px; resize:vertical; } .campo .ayuda { font-size:12px; color:var(--txt2); margin-top:3px; }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:560px) { .dos { grid-template-columns:1fr; } }
  .pie { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; margin-top:16px; }
  .error { background:#FCE7E5; border:1px solid #F2B8B3; color:#8C1F1B; border-radius:10px; padding:9px 12px; font-size:13.5px; margin-top:10px; }
  .dato { margin-bottom:12px; } .dato .et { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--txt2); margin-bottom:2px; }
  .dato .va { font-size:14.5px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 14px; }
  .bloque { border-top:1px solid var(--borde); margin-top:14px; padding-top:14px; } .bloque h4 { font-size:14.5px; font-weight:800; margin-bottom:8px; }
  .bit { list-style:none; } .bit li { font-size:13.5px; padding:6px 0; border-top:1px solid var(--borde); } .bit li:first-child { border-top:none; }
  .bit .q { color:var(--txt2); font-size:12.5px; } .bit .nt { white-space:pre-wrap; word-wrap:break-word; margin-top:2px; }
  .resumen { background:var(--gris); border-radius:10px; padding:10px 12px; font-size:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; max-height:40vh; overflow-y:auto; }
  /* Capturas (11-nov-2026): miniaturas en el formulario y lista en el detalle; mismos bordes y botones del módulo */
  .caps { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; } .caps:empty { display:none; }
  .cap { display:flex; align-items:center; gap:8px; max-width:100%; border:1px solid var(--borde); border-radius:10px; padding:6px 8px; font-size:13px; }
  .cap img { width:48px; height:48px; object-fit:cover; border-radius:6px; border:1px solid var(--borde); } .cap span { font-weight:700; word-break:break-all; }
  .cap button { background:#fff; border:1px solid #d4d4d8; border-radius:8px; padding:4px 9px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; }
  .capfila { border-top:1px solid var(--borde); padding:8px 0; font-size:13.5px; word-wrap:break-word; } .capfila:first-of-type { border-top:none; }
  .capfila .q { color:var(--txt2); font-size:12.5px; } .capfila .ac { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .capfila img { display:block; max-width:100%; border:1px solid var(--borde); border-radius:8px; margin-top:8px; }
  /* Tickets V1 (12-nov-2026): estados del flujo automático y la propuesta de arreglo con su código */
  .e-revisando { background:#EDE9FE; color:#4C1D95; } .e-propuesta { background:#DBEAFE; color:#1E3A8A; } .e-detenido { background:#8C1F1B; color:#fff; }
  .caja.ancha { max-width:980px; }
  .prop { border:1px solid var(--borde); border-radius:12px; padding:14px; margin-bottom:12px; }
  .codigo { background:#18181b; color:#e4e4e7; border-radius:10px; padding:12px; font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; overflow:auto; max-height:46vh; tab-size:4; }
  .codigo .mas { color:#86efac; } .codigo .menos { color:#fca5a5; } .codigo .ubi { color:#93c5fd; } .codigo .arch { color:#fde68a; font-weight:700; }
  .codigo.corrido { white-space:pre-wrap; word-break:break-all; } .codigo .corte { color:#a1a1aa; font-style:italic; font-weight:400; }
  .codigo .menos .cambio { background:#7f1d1d; color:#fff; border-radius:3px; padding:1px 2px; } .codigo .mas .cambio { background:#14532d; color:#fff; border-radius:3px; padding:1px 2px; }
  .plegado { margin-bottom:12px; } .plegado summary { cursor:pointer; font-size:13px; font-weight:700; margin-bottom:6px; }
  .huella { font:12px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--txt2); word-break:break-all; }
  .hecho { background:#E3F3E8; border:1px solid #B7DFC4; color:#1E5A36; border-radius:10px; padding:9px 12px; font-size:13.5px; margin-bottom:12px; white-space:pre-wrap; word-wrap:break-word; }

<!-- Sesión y canal con el servidor: el mismo código del lanzador (index.html), sin cambios. -->
<script type="module">
/* SQL Connect: misma sesión de Firebase que los módulos (ver /compras/). */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";
import { getDataConnect, mutationRef, executeMutation } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-data-connect.js";
const fbApp = initializeApp({"apiKey": "AIzaSyC1ycKtN1atpb1monWFIJqmR4X5vmpnNoo", "authDomain": "lem-erp.firebaseapp.com", "projectId": "lem-erp", "appId": "1:902179844288:web:e887a0886fa1188da2fd25"});
const fbAuth = getAuth(fbApp);
const dc = getDataConnect(fbApp, { connector: "api", location: "us-central1", service: "lem-api" });
let resolverListo; const listo = new Promise(r => { resolverListo = r; });
onAuthStateChanged(fbAuth, () => resolverListo());
window.LEMDC = {
  listo,
  usuario: () => fbAuth.currentUser,
  entrar: (idToken) => signInWithCredential(fbAuth, GoogleAuthProvider.credential(idToken)),
  salir: () => signOut(fbAuth).catch(() => {}),
  llamar: async (accion, datos) => {
    const r = await executeMutation(mutationRef(dc, "Accion", { accion, datos: JSON.stringify(datos || {}) }));
    return (r && r.data && r.data.r && r.data.r.r) || {};
  }
};
</script>
<script>
/* Sesión, token y api(): copiados tal cual del lanzador (10-nov-2026). Esta página no carga punto-de-vista.js:
   Tickets se usa siempre en la vista propia. */
const CLIENT_ID = '902179844288-c4ppk03u5ss2vdqvl0chfoghhedi9ape.apps.googleusercontent.com';
const API = 'https://rountree.app.n8n.cloud/webhook/compras-api';
const store = { get(){ try { return sessionStorage.getItem('lem_tok'); } catch(e){ return null; } }, set(v){ try { sessionStorage.setItem('lem_tok', v); } catch(e){} }, del(){ try { sessionStorage.removeItem('lem_tok'); } catch(e){} } };
const S = { token: store.get() || null, perfil: null };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
function emailDeToken(t) { try { return (JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).email || '').toLowerCase(); } catch (e) { return ''; } }
async function esperarLEMDC() {
  if (!window.LEMDC) await new Promise(r => { const t0 = Date.now(); const iv = setInterval(() => { if (window.LEMDC || Date.now() - t0 > 4000) { clearInterval(iv); r(); } }, 50); });
  if (window.LEMDC) await Promise.race([LEMDC.listo, new Promise(r => setTimeout(r, 4000))]);
}
async function apiN8n(accion, datos) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: S.token, accion, datos: datos || {} }) });
  if (r.status === 401) { const e = new Error('401'); e.expirada = true; throw e; }
  return await r.json();
}
/* Punto de vista (mig. 097): la vista elegida viaja en datos.ver_como; si el servidor la rechaza, la página vuelve a la vista
   propia sin cerrar la sesión (punto-de-vista.js). Sin ese archivo, todo funciona igual en la vista propia. */
async function api(accion, datos) {
  const d = window.LEM_PV ? LEM_PV.datos(accion, datos) : datos;
  const j = await apiCruda(accion, d);
  if (window.LEM_PV && LEM_PV.rechazo(j)) return LEM_PV.pendiente();
  return j;
}
async function apiCruda(accion, datos) {
  try {
    await esperarLEMDC();
    if (window.LEMDC && S.token) {
      const u = LEMDC.usuario(); const em = emailDeToken(S.token);
      if (!u || (em && (u.email || '').toLowerCase() !== em)) await LEMDC.entrar(S.token);
    }
    if (window.LEMDC && LEMDC.usuario()) return await LEMDC.llamar(accion, datos);
  } catch (e) { console.warn('SQL Connect no disponible, usando n8n:', e && e.message); }
  return apiN8n(accion, datos);
}
/* ── Tickets v0 (10-nov-2026, Sergio): tickets del portal con triage. Permisos, datos y conteos los entrega el servidor
   (acciones tk_*); esta página solo presenta y manda. Toda acción que guarda pasa por un modal de confirmación. ── */
const T = { ini: null, filtro: 'todos', det: null, prop: null, pend: null, guardando: false, caps: [], urls: [], capGen: 0, capPend: 0 };
/* Tickets V1 (12-nov-2026, necesita la 148): revisando = Claude lo tomó; propuesta = espera la aprobación de uno de los aprobadores de Tickets;
   detenido = lo paró la revisión de seguridad o falló al preparar o al publicar. El orden es el del flujo. */
const ESTADOS = { nuevo: 'Nuevo', aceptado: 'Aceptado', revisando: 'Revisando', propuesta: 'Propuesta', en_proceso: 'En proceso', publicado: 'Publicado', cerrado: 'Cerrado', detenido: 'Detenido', rechazado: 'Rechazado' };
const ALCANCES = { pantalla: 'Solo pantalla', base: 'Solo base de datos', pantalla_y_base: 'Pantalla y base de datos', sin_cambio: 'Sin cambio de código' };
const PROP_ESTADOS = { pendiente: 'Espera aprobación', aprobada: 'Aprobada: publicando', rechazada: 'Rechazada', publicada: 'Publicada', fallida: 'Falló al publicar' };
const TIPOS = { error: 'Error', observacion: 'Observación', mejora: 'Mejora' };
const MODS = { portal: 'Portal (inicio)', compras: 'Compras', inventarios: 'Inventarios', nominas: 'Nóminas', ventas: 'Ventas', contabilidad: 'Contabilidad', asistente: 'Asistente', otro: 'Otro' };
const PRIOS = { alta: 'Alta', media: 'Media', baja: 'Baja' };
const EVENTOS = { nota: 'Nota', creado: 'Creado', reabierto: 'Reabierto', captura: 'Captura agregada', captura_quitada: 'Captura quitada',
                  revisando: 'Claude lo tomó', propuesta: 'Propuesta lista', propuesta_aprobada: 'Propuesta aprobada', propuesta_rechazada: 'Se pidió otra propuesta', reintento: 'Reintento' };
/* A qué estado puede pasar un ticket desde donde está. Es solo para pintar las opciones: el servidor vuelve a revisarlo. */
const SIGUE = { aceptado: ['en_proceso', 'publicado', 'cerrado'], en_proceso: ['publicado', 'cerrado'], publicado: ['cerrado'], rechazado: ['cerrado', 'nuevo'], cerrado: ['nuevo'] };
const ISSUE_NUEVO = 'https://github.com/Sergiorountree/operaciones-lem/issues/new?template=ticket.md';
function fechaHora(iso) {
  try { return new Intl.DateTimeFormat('es-MX', { timeZone: 'America/Chihuahua', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)); }
  catch (e) { return String(iso || '').slice(0, 16).replace('T', ' '); }
}
const chipEstado = e => '<span class="chip e-' + esc(e) + '">' + esc(ESTADOS[e] || e) + '</span>';
const chipPrio = p => p ? '<span class="chip p-' + esc(p) + '">' + esc(PRIOS[p] || p) + '</span>' : '';
const val = id => { const el = $(id); return el ? String(el.value || '').trim() : ''; };

function vLogin(msj) {
  $('hUser').innerHTML = '';
  $('app').innerHTML = '<div class="login"><div class="ico">🎫</div><h2>Tickets</h2><p>' + esc(msj || 'Entra con tu cuenta @grupolem.com') + '</p><div id="gbtn" style="display:flex;justify-content:center"></div></div>';
  if (window.google) {
    google.accounts.id.initialize({ client_id: CLIENT_ID, itp_support: true,
      error_callback: (e) => aviso('Google no pudo abrir la ventana de acceso (' + ((e && e.type) || 'desconocido') + '). Si tu navegador bloquea ventanas emergentes, permítelas para este sitio y reintenta.'),
      callback: (resp) => { S.token = resp.credential; store.set(S.token); arrancar(); } });
    google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', locale: 'es' });
  } else { setTimeout(() => vLogin(msj), 400); }
}
function aviso(t) { const d = document.createElement('div'); d.className = 'aviso'; d.textContent = t; $('app').prepend(d); }
function salir() { T.guardando = false; cerrarModal(); store.del(); S.token = null; S.perfil = null; T.ini = null; if (window.LEMDC) LEMDC.salir(); vLogin('Sesión cerrada.'); }
function vSinAcceso(t) {
  $('hUser').innerHTML = esc(emailDeToken(S.token)) + '<button onclick="salir()">Salir</button>';
  $('app').innerHTML = '<div class="msg">' + esc(t) + '<br><br><a href="/">← Volver a los módulos</a></div>';
}

/* ── Lista ── */
function pintar() {
  const r = T.ini, cuenta = r.cuenta || {}, admin = !!r.puede_triage;
  $('hUser').innerHTML = esc(r.usuario) + '<button onclick="salir()">Salir</button>';
  const lista = (r.tickets || []).filter(t => T.filtro === 'todos' || t.estado === T.filtro);
  let h = '<div class="barra"><div><h2>Tickets del portal</h2><p>' +
          (admin ? 'Errores, observaciones y mejoras que levanta el equipo. Aquí se aceptan o se rechazan.'
                 : 'Levanta aquí un error, una observación o una mejora de cualquier pantalla. Ves los tickets que tú levantaste.') +
          '</p></div><button class="btn btn-rojo" onclick="abrirNuevo()">Levantar ticket</button></div>';
  h += '<div class="filtros"><button class="filtro' + (T.filtro === 'todos' ? ' on' : '') + '" onclick="filtrar(\'todos\')">Todos</button>';
  for (const e of Object.keys(ESTADOS)) {
    h += '<button class="filtro' + (T.filtro === e ? ' on' : '') + '" onclick="filtrar(\'' + e + '\')">' + esc(ESTADOS[e]) + '<span class="n">' + esc(cuenta[e] || 0) + '</span></button>';
  }
  h += '</div><div class="hoja">';
  if (!lista.length) {
    h += '<div class="vacio">' + ((r.tickets || []).length ? 'No hay tickets en este estado.' : 'Todavía no hay tickets. Usa «Levantar ticket» para registrar el primero.') + '</div>';
  } else {
    h += '<table><thead><tr><th>#</th><th>Fecha</th><th>Módulo</th><th>Tipo</th><th>Título</th><th>Estado</th><th>Prioridad</th>' + (admin ? '<th>Levantó</th>' : '') + '</tr></thead><tbody>';
    for (const t of lista) {
      h += '<tr onclick="abrirDetalle(' + Number(t.ticket_id) + ')"><td class="num">' + esc(t.ticket_id) + '</td><td class="chico">' + esc(fechaHora(t.creado_en)) + '</td>' +
           '<td class="chico">' + esc(MODS[t.modulo] || t.modulo) + '</td><td class="chico">' + esc(TIPOS[t.tipo] || t.tipo) + '</td><td class="tit">' + esc(t.titulo) + '</td>' +
           '<td>' + chipEstado(t.estado) + '</td><td>' + chipPrio(t.prioridad) + '</td>' + (admin ? '<td class="chico">' + esc(t.creado_por) + '</td>' : '') + '</tr>';
    }
    h += '</tbody></table>';
  }
  $('app').innerHTML = h + '</div>';
}
function filtrar(e) { T.filtro = e; pintar(); }
async function recargar() {
  const r = await api('tk_inicio');
  if (r && r.error) { aviso('No se pudo actualizar la lista: ' + (r.detalle || r.error)); return; }
  T.ini = r; pintar();
}

/* ── Modales ── */
function abrirModal(html, chica, ancha) { $('modal').innerHTML = '<div class="caja' + (chica ? ' chica' : ancha ? ' ancha' : '') + '">' + html + '</div>'; $('modal').hidden = false; }
function cerrarModal() { if (T.guardando) return; capSoltar(); $('modal').hidden = true; $('modal').innerHTML = ''; cerrarConf(); T.det = null; T.prop = null; }
function cerrarConf() { if (T.guardando) return; $('conf').hidden = true; $('conf').innerHTML = ''; T.pend = null; }
function errorEn(id, t) { const el = $(id); if (el) { el.textContent = t; el.hidden = !t; } }
/* Doble check: nada se manda sin pasar por aquí. `resumen` es texto plano; `hacer` es la llamada que guarda. */
function confirmar(titulo, resumen, boton, hacer) {
  if (T.guardando) return;
  T.pend = hacer;
  $('conf').innerHTML = '<div class="caja chica"><h3>' + esc(titulo) + '</h3><p class="sub">Revisa antes de guardar.</p><div class="resumen">' + esc(resumen) + '</div>' +
    '<div class="error" id="eConf" hidden></div><div class="pie"><button class="btn btn-claro" id="bReg" onclick="cerrarConf()">Regresar</button>' +
    '<button class="btn btn-rojo" id="bConf" onclick="ejecutar()">' + esc(boton) + '</button></div></div>';
  $('conf').hidden = false;
}
/* Mientras una petición de guardado está en camino (T.guardando) no se puede cerrar ni volver a mandar: ni con Regresar,
   ni con Escape, ni abriendo otra confirmación (10-nov-2026, revisión de Codex en el PR #10). */
async function ejecutar() {
  const hacer = T.pend; if (!hacer || T.guardando) return;
  T.guardando = true;
  const b = $('bConf'), reg = $('bReg'); b.disabled = true; if (reg) reg.disabled = true; errorEn('eConf', '');
  const soltar = () => { T.guardando = false; b.disabled = false; if (reg) reg.disabled = false; };
  let r;
  try { r = await hacer(); }
  catch (e) {
    soltar();
    if (e && e.expirada) { cerrarModal(); store.del(); S.token = null; vLogin('Tu sesión expiró — vuelve a entrar.'); return; }
    errorEn('eConf', 'No se pudo conectar (' + ((e && e.message) || 'error') + '). Puede que sí se haya guardado: cierra y revisa la lista antes de reintentar.'); return;
  }
  soltar();
  if (r && r.error) { errorEn('eConf', r.detalle || r.error); return; }
  /* Ya se guardó. Lo que sigue solo refresca la pantalla: si falla, se cierra el formulario y se avisa, para que nadie
     vuelva a guardar lo mismo. */
  const id = T.det ? T.det.ticket.ticket_id : null;
  cerrarModal();
  try { await recargar(); if (id) await abrirDetalle(id); }
  catch (e) { aviso('Se guardó, pero no se pudo actualizar la lista. Recarga la página para verla al día.'); }
  if (r && r.aviso) aviso(r.aviso);   // se guardó, pero algo quedó a medias (p. ej. una captura que no subió)
}

/* ── Levantar un ticket ── */

  T.det = null; capSoltar();
  const cap = capLim();
  const ops = (o, lista) => lista.map(k => '<option value="' + esc(k) + '">' + esc(o[k] || k) + '</option>').join('');
  abrirModal('<h3>Levantar ticket</h3><p class="sub">No escribas contraseñas, sueldos ni datos personales de colaboradores.' + (cap ? '' : ' Esta versión no guarda capturas.') + '</p>' +
    '<div class="dos"><div class="campo"><label for="nMod">Módulo</label><select id="nMod"><option value="">Elige…</option>' + ops(MODS, T.ini.modulos || Object.keys(MODS)) + '</select></div>' +
    '<div class="campo"><label for="nTipo">Tipo</label><select id="nTipo"><option value="">Elige…</option>' + ops(TIPOS, T.ini.tipos || Object.keys(TIPOS)) + '</select></div></div>' +
    '<div class="campo"><label for="nPant">Pantalla (opcional)</label><input id="nPant" maxlength="120" placeholder="Por ejemplo: Semáforo, Cierre semanal"></div>' +
    '<div class="campo"><label for="nTit">Título</label><input id="nTit" maxlength="120" placeholder="Qué pasa, en una línea"></div>' +

    (cap ? '<div class="campo"><label>Capturas de pantalla (opcional)</label><div class="caps" id="nCaps"></div>' +

    '<div class="error" id="eNuevo" hidden></div>' +

function guardarNuevo() {
  /* Si una captura todavía se está reduciendo, no se arma la confirmación: se guardaría el ticket sin ella (11-nov-2026, revisión de Codex en el PR #14) */
  if (T.capPend) return errorEn('eNuevo', 'Espera un momento: se está preparando la captura.');
  const d = { modulo: val('nMod'), tipo: val('nTipo'), pantalla: val('nPant'), titulo: val('nTit'), descripcion: val('nDes'), pasos: val('nPasos') };
  if (!d.modulo) return errorEn('eNuevo', 'Elige el módulo donde pasa.');
  if (!d.tipo) return errorEn('eNuevo', 'Elige el tipo: error, observación o mejora.');
  if (d.titulo.length < 5) return errorEn('eNuevo', 'Escribe un título de al menos 5 letras.');
  if (d.descripcion.length < 10) return errorEn('eNuevo', 'Describe qué pasa hoy y qué debería pasar.');
  errorEn('eNuevo', '');
  const caps = T.caps.slice();
  confirmar('¿Levantar este ticket?', (MODS[d.modulo] || d.modulo) + ' · ' + (TIPOS[d.tipo] || d.tipo) + (d.pantalla ? ' · ' + d.pantalla : '') + '\n\n' + d.titulo + '\n\n' + d.descripcion + (d.pasos ? '\n\nPasos:\n' + d.pasos : '') +
    (caps.length ? '\n\nCapturas: ' + caps.length : ''),
    'Sí, levantar', () => crearConCapturas(d, caps));
}
/* Primero se levanta el ticket y después sube cada captura (11-nov-2026). Si una no sube, el ticket ya quedó: se avisa cuál
   faltó para agregarla desde el detalle. Mandar dos veces la misma imagen no la duplica: el servidor la reconoce. */
async function crearConCapturas(d, caps) {
  const r = await api('tk_crear', d);
  if (!r || r.error || !caps.length) return r;
  const id = r.ticket && r.ticket.ticket_id, faltan = [];
  for (const c of caps) {
    let x;
    try { x = await subirCaptura({ ticket_id: id, nombre: c.nombre, datos: c.datos }); }
    catch (e) { if (e && e.expirada) throw e; x = { error: 'conexion', detalle: 'no se pudo conectar' }; }
    if (!x || x.error) faltan.push(c.nombre + ' (' + ((x && (x.detalle || x.error)) || 'sin respuesta') + ')');
  }
  if (faltan.length) r.aviso = 'El ticket #' + id + ' se levantó, pero no subió: ' + faltan.join('; ') + '. Ábrelo y agrégala desde ahí.';
  return r;
}

/* ── Detalle, bitácora, triage y estado ── */

  abrirModal('<div class="msg">Cargando…</div>');
  let r;
  try { r = await api('tk_detalle', { ticket_id: id }); }
  catch (e) { abrirModal('<div class="error">No se pudo conectar. Reintenta.</div><div class="pie"><button class="btn btn-claro" onclick="cerrarModal()">Cerrar</button></div>', true); return; }
  if (!r || r.error) { abrirModal('<div class="error">' + esc((r && (r.detalle || r.error)) || 'Sin respuesta') + '</div><div class="pie"><button class="btn btn-claro" onclick="cerrarModal()">Cerrar</button></div>', true); return; }
  T.det = r;
  const t = r.ticket, admin = !!r.puede_triage;
  /* Tickets V1: la propuesta de arreglo la ve solo administración. Si el servidor no trae la acción o falla, el detalle queda como antes. */
  let pr = null;
  if (admin && t.estado !== 'nuevo') {
    try { const x = await api('tk_propuesta', { ticket_id: id }); if (x && x.ok) pr = x; } catch (e) {}
    if (T.det !== r) return;                                            // el detalle se cerró mientras llegaba la propuesta
  }
  T.prop = pr;
  const publicando = t.estado === 'en_proceso' && !!pr && (pr.propuestas || []).some(p => p.estado === 'aprobada');
  let h = '<h3>#' + esc(t.ticket_id) + ' · ' + esc(t.titulo) + '</h3><div class="meta">' + chipEstado(t.estado) + chipPrio(t.prioridad) +
          '<span class="chip e-cerrado">' + esc(MODS[t.modulo] || t.modulo) + '</span><span class="chip e-cerrado">' + esc(TIPOS[t.tipo] || t.tipo) + '</span></div>';
  h += '<div class="dato"><div class="et">Levantó</div><div class="va">' + esc(t.creado_por) + ' · ' + esc(fechaHora(t.creado_en)) + (t.pantalla ? ' · pantalla: ' + esc(t.pantalla) : '') + '</div></div>';
  h += '<div class="dato"><div class="et">Qué pasa hoy y qué debería pasar</div><div class="va">' + esc(t.descripcion) + '</div></div>';
  if (t.pasos) h += '<div class="dato"><div class="et">Pasos para verlo</div><div class="va">' + esc(t.pasos) + '</div></div>';
  if (t.triage_por) h += '<div class="dato"><div class="et">Triage</div><div class="va">' + esc(t.triage_por) + ' · ' + esc(fechaHora(t.triage_en)) + (t.triage_nota ? '\n' + esc(t.triage_nota) : '') + '</div></div>';
  if (t.issue_numero || t.pr_numero) h += '<div class="dato"><div class="et">GitHub</div><div class="va">' + (t.issue_numero ? 'Issue #' + esc(t.issue_numero) : '') + (t.issue_numero && t.pr_numero ? ' · ' : '') + (t.pr_numero ? 'PR #' + esc(t.pr_numero) : '') + '</div></div>';
  /* Capturas (11-nov-2026): el servidor manda la lista sin la imagen; cada imagen se pide hasta que alguien la quiere ver */
  const caps = r.capturas || [], lim = capLim();
  if (caps.length || lim) {
    h += '<div class="bloque"><h4>Capturas</h4>' + (caps.length ? '' : '<p class="sub" style="margin:0">Este ticket no tiene capturas.</p>') +
         caps.map(c => { const id = Number(c.captura_id); return '<div class="capfila"><b>' + esc(c.nombre) + '</b> <span class="q">· ' + esc(c.kb) + ' KB · ' + esc(c.subido_por) + ' · ' + esc(fechaHora(c.creado_en)) + '</span>' +
           '<div class="ac"><button class="btn btn-claro" onclick="verCaptura(' + id + ')">Ver</button>' + (c.puede_quitar ? '<button class="btn btn-peligro" onclick="quitarCaptura(' + id + ')">Quitar</button>' : '') + '</div><div id="capv' + id + '"></div></div>'; }).join('') +
         '<div class="error" id="eCap" hidden></div>' +
         (lim && caps.length < Number(lim.max_por_ticket) ? '<div class="pie"><input type="file" id="dArch" accept="image/png,image/jpeg,image/webp" hidden onchange="agregarCaptura([...this.files]); this.value=\'\'">' +
           '<button class="btn btn-claro" id="bCap" onclick="$(\'dArch\').click()">Agregar captura</button></div><p class="sub" style="margin:8px 0 0">También puedes pegarla con Cmd+V. Se queda en el portal: no va a GitHub.</p>' : '') + '</div>';

    h += '<div class="bloque"><h4>Triage</h4><div class="dos"><div class="campo"><label for="tPrio">Prioridad (para aceptar)</label><select id="tPrio"><option value="">Elige…</option><option value="alta">Alta</option><option value="media">Media</option><option value="baja">Baja</option></select></div>' +

         '<div class="error" id="eTriage" hidden></div><div class="pie"><button class="btn btn-peligro" onclick="triage(\'rechazar\')">Rechazar</button><button class="btn btn-azul" onclick="triage(\'aceptar\')">Aceptar</button></div></div>';
  }
  h += propuestaHtml(t, pr, r.eventos);
  /* Con una propuesta aprobada el avance lo mueve el taller: moverlo a mano a media publicación lo dejaría a medias. */
  if (admin && SIGUE[t.estado] && !publicando) {
    h += '<div class="bloque"><h4>Avance</h4><div class="dos"><div class="campo"><label for="sEstado">Pasar a</label><select id="sEstado"><option value="">Elige…</option>' +

         '<div class="campo"><label for="sNota">Nota (opcional)</label><input id="sNota" maxlength="1000"></div></div>' +
         '<div class="dos"><div class="campo"><label for="sIssue">Issue de GitHub (número)</label><input id="sIssue" inputmode="numeric" maxlength="7" value="' + esc(t.issue_numero || '') + '"></div>' +
         '<div class="campo"><label for="sPr">PR de GitHub (número)</label><input id="sPr" inputmode="numeric" maxlength="7" value="' + esc(t.pr_numero || '') + '"></div></div>' +
         '<div class="error" id="eEstado" hidden></div><div class="pie">' +
         (t.estado === 'aceptado' ? '<button class="btn btn-claro" onclick="copiarParaGitHub()">Copiar texto para GitHub</button><a class="btn btn-claro" href="' + ISSUE_NUEVO + '" target="_blank" rel="noopener">Abrir issue nuevo</a>' : '') +
         '<button class="btn btn-azul" onclick="cambiarEstado()">Guardar avance</button></div>' +
         (t.estado === 'aceptado' ? '<p class="sub" style="margin:10px 0 0">El repositorio es público: antes de pegar el texto en GitHub quita nombres, correos y montos.</p>' : '') + '</div>';
  }
  h += '<div class="bloque"><h4>Bitácora</h4><ul class="bit">' + (r.eventos || []).map(e =>
         '<li><b>' + esc(EVENTOS[e.evento] || ESTADOS[e.evento] || e.evento) + '</b> <span class="q">· ' + esc(e.usuario) + ' · ' + esc(fechaHora(e.creado_en)) + '</span>' +
         (e.nota ? '<div class="nt">' + esc(e.nota) + '</div>' : '') + '</li>').join('') + '</ul>' +
       '<div class="campo" style="margin-top:10px"><label for="dNota">Agregar una nota</label><textarea id="dNota" maxlength="1000" style="min-height:64px"></textarea></div>' +
       '<div class="error" id="eNota" hidden></div><div class="pie"><button class="btn btn-claro" onclick="cerrarModal()">Cerrar</button><button class="btn btn-rojo" onclick="guardarNota()">Guardar nota</button></div></div>';
  abrirModal(h, false, !!(pr && (pr.propuestas || []).length));
  T.det = r; T.prop = pr;
}

/* ── Tickets V1 (12-nov-2026, Sergio; necesita la 148): la propuesta de arreglo que deja Opus 5.5 ya con el código. Lo que se
   aprueba es lo que se ve aquí: la huella de la propuesta viaja con la aprobación y el servidor la compara; si la propuesta
   cambió, no se aprueba. Deciden los aprobadores de Tickets (basta uno); eso lo revisa el servidor, no esta pantalla. ── */
function codigoHtml(txt, esDiff) {
  return '<div class="codigo">' + String(txt == null ? '' : txt).split('\n').map(l => {
    const c = !esDiff ? '' : /^(\+\+\+|---|diff )/.test(l) ? 'arch' : l[0] === '+' ? 'mas' : l[0] === '-' ? 'menos' : l.slice(0, 2) === '@@' ? 'ubi' : '';
    return c ? '<span class="' + c + '">' + esc(l) + '</span>' : esc(l);
  }).join('\n') + '</div>';
}
/* Los archivos del portal traen renglones de miles de letras: el cambio de una palabra se vería como dos renglones enormes.
   Esta vista empareja cada renglón quitado con el que lo reemplaza, recorta lo que quedó igual y resalta solo lo que cambió.
   Es una ayuda para leer: el cambio completo, sin recortar, se enseña aparte y es lo que se aprueba. */
function diffResumidoHtml(txt) {
  const L = String(txt == null ? '' : txt).split('\n'), out = [], CTX = 70, MAX = 200;
  const corte = n => '<span class="corte"> … ' + n + ' letras iguales … </span>';
  const rec = s => s.length > MAX ? esc(s.slice(0, MAX)) + corte(s.length - MAX) : esc(s);
  const par = (signo, clase, x, pre, suf) => {
    const ini = Math.max(0, pre - CTX), fin = Math.min(x.length, x.length - suf + CTX), medio = x.slice(pre, x.length - suf);
    return '<span class="' + clase + '">' + signo + ' ' + (ini ? corte(ini) : '') + esc(x.slice(ini, pre)) + '<span class="cambio">' + (medio ? rec(medio) : '') + '</span>' +
           esc(x.slice(x.length - suf, fin)) + (fin < x.length ? corte(x.length - fin) : '') + '</span>';
  };
  let enBloque = false;
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (l.slice(0, 5) === 'diff ') { enBloque = false; out.push('<span class="arch">' + esc(l.replace(/^diff --git a\/(\S+) b\/.*$/, 'Archivo: $1')) + '</span>'); continue; }
    if (l.slice(0, 2) === '@@') { enBloque = true; out.push('<span class="ubi">' + esc(l.slice(0, 120)) + '</span>'); continue; }
    if (!enBloque) continue;                                            // encabezado del archivo (index, ---, +++): ya se dijo cuál es
    if (l[0] !== '-' && l[0] !== '+') { if (l[0] !== '\\') out.push(rec(l)); continue; }
    const quita = [], pone = [];
    while (i < L.length && L[i][0] === '-') quita.push(L[i++].slice(1));
    while (i < L.length && L[i][0] === '+') pone.push(L[i++].slice(1));
    i--;
    for (let k = 0; k < Math.max(quita.length, pone.length); k++) {
      const a = quita[k], b = pone[k];
      if (a == null) { out.push('<span class="mas">+ ' + rec(b) + '</span>'); continue; }
      if (b == null) { out.push('<span class="menos">- ' + rec(a) + '</span>'); continue; }
      let pre = 0; const tope = Math.min(a.length, b.length);
      while (pre < tope && a[pre] === b[pre]) pre++;
      let suf = 0; while (suf < tope - pre && a[a.length - 1 - suf] === b[b.length - 1 - suf]) suf++;
      out.push(par('-', 'menos', a, pre, suf)); out.push(par('+', 'mas', b, pre, suf));
    }
  }
  return '<div class="codigo corrido">' + out.join('\n') + '</div>';
}
function seguridadTxt(s) {
  if (!s || typeof s !== 'object' || !Object.keys(s).length) return '';
  const av = Array.isArray(s.avisos) ? s.avisos.filter(a => typeof a === 'string' && a) : [];
  return String(s.resultado || 'Sin resultado') + (s.resumen ? ' · ' + s.resumen : '') + (av.length ? '\n· ' + av.join('\n· ') : '');
}
function propuestaHtml(t, pr, eventos) {
  const ps = (pr && pr.propuestas) || [], p = ps[0], puede = !!(pr && pr.puede_aprobar);
  if (!p && t.estado !== 'revisando' && t.estado !== 'detenido') return '';
  const dato = (et, va) => va ? '<div class="dato"><div class="et">' + esc(et) + '</div><div class="va">' + esc(va) + '</div></div>' : '';
  const decision = x => x.decidido_por ? esc(x.decidido_por) + ' · ' + esc(fechaHora(x.decidido_en)) : '';
  let h = '<div class="bloque"><h4>Propuesta de arreglo</h4>';
  if (t.estado === 'revisando') h += '<p class="sub" style="margin:0 0 12px">Claude está revisando el ticket y preparando el arreglo. La propuesta aparece aquí cuando esté lista.</p>';
  if (t.estado === 'detenido') {
    const ev = (eventos || []).filter(e => e.evento === 'detenido').pop();
    h += '<div class="error" style="margin:0 0 12px"><b>Detenido.</b> ' + esc((ev && ev.nota) || 'Sin motivo registrado.') + '</div>';
  }
  if (p) {
    h += '<div class="prop"><div class="meta" style="margin-top:0"><span class="chip e-propuesta">Versión ' + esc(p.version) + '</span>' +
         '<span class="chip e-cerrado">' + esc(ALCANCES[p.alcance] || p.alcance) + '</span><span class="chip e-cerrado">' + esc(PROP_ESTADOS[p.estado] || p.estado) + '</span>' +
         '<span class="chip e-cerrado">' + esc(fechaHora(p.creado_en)) + '</span></div>';
    if (p.estado === 'publicada') h += '<div class="hecho"><b>Publicada</b> · ' + esc(fechaHora(p.publicado_en)) + ((p.publicado_detalle && p.publicado_detalle.resumen) ? '\n' + esc(p.publicado_detalle.resumen) : '') + '</div>';
    if (p.estado === 'aprobada') h += '<div class="hecho">Aprobada por ' + decision(p) + '. Opus la está publicando: aplica el código, corre la prueba y pasa el ticket a Publicado.</div>';
    h += dato('Causa', p.causa) + dato('Qué cambia', p.cambios) + dato('Revisión de seguridad del ticket', seguridadTxt(p.seguridad)) + dato('Revisión de Codex', p.revision_codex);
    if (p.sql_migracion) h += '<div class="dato"><div class="et">Base de datos · ' + esc(p.archivo_migracion) + '</div>' + codigoHtml(p.sql_migracion, false) + '</div>';
    if (p.diff_pantalla) h += '<div class="dato"><div class="et">Pantalla · qué cambia (lo resaltado)</div>' + diffResumidoHtml(p.diff_pantalla) +
         '<details class="plegado" style="margin:8px 0 0"><summary>Ver el cambio completo, sin recortar (es lo que se aprueba)</summary>' + codigoHtml(p.diff_pantalla, true) + '</details></div>';
    if (p.prueba) h += '<details class="plegado"><summary>Prueba que se corre al publicar</summary>' + codigoHtml(p.prueba, false) + '</details>';
    if (p.estado === 'rechazada' || p.estado === 'fallida') h += dato(PROP_ESTADOS[p.estado], (p.decidido_por ? p.decidido_por + ' · ' + fechaHora(p.decidido_en) + '\n' : '') + (p.nota || ''));
    h += '<div class="huella">Huella ' + esc(p.huella) + '</div></div>';
  }
  if (t.estado === 'propuesta' && p && p.estado === 'pendiente') {
    h += puede
      ? '<div class="campo"><label for="pNota">Nota (obligatoria para pedir otra propuesta o descartar)</label><input id="pNota" maxlength="1000" placeholder="Qué está mal o qué falta"></div>' +
        '<div class="error" id="eProp" hidden></div><div class="pie"><button class="btn btn-peligro" onclick="decidir(\'descartar\')">Descartar ticket</button>' +
        '<button class="btn btn-claro" onclick="decidir(\'rechazar\')">Pedir otra propuesta</button><button class="btn btn-azul" onclick="decidir(\'aprobar\')">' + (p.alcance === 'sin_cambio' ? 'Aprobar' : 'Aprobar y publicar') + '</button></div>'
      : '<p class="sub" style="margin:0">La aprueban los aprobadores de Tickets.</p>';
  }
  if (t.estado === 'detenido') {
    h += puede
      ? '<div class="campo"><label for="pNota">Nota (obligatoria para descartar)</label><input id="pNota" maxlength="1000"></div>' +
        '<div class="error" id="eProp" hidden></div><div class="pie"><button class="btn btn-peligro" onclick="decidir(\'descartar\')">Descartar ticket</button>' +
        '<button class="btn btn-azul" onclick="decidir(\'reintentar\')">Reintentar</button></div>'
      : '<p class="sub" style="margin:0">Lo reintentan o lo descartan los aprobadores de Tickets.</p>';
  }
  if (ps.length > 1) {
    h += '<details class="plegado" style="margin-top:12px"><summary>Propuestas anteriores (' + (ps.length - 1) + ')</summary><ul class="bit">' + ps.slice(1).map(x =>
           '<li><b>Versión ' + esc(x.version) + ' · ' + esc(PROP_ESTADOS[x.estado] || x.estado) + '</b> <span class="q">' + (x.decidido_por ? '· ' + decision(x) : '') + '</span>' +
           (x.nota ? '<div class="nt">' + esc(x.nota) + '</div>' : '') + '<div class="nt">' + esc(x.causa) + '</div></li>').join('') + '</ul></details>';
  }
  return h + '</div>';
}
function decidir(decision) {
  const t = T.det.ticket, p = ((T.prop && T.prop.propuestas) || [])[0], nota = val('pNota');
  if (decision === 'rechazar' && nota.length < 5) return errorEn('eProp', 'Escribe qué está mal o qué falta, para que la siguiente propuesta lo corrija.');
  if (decision === 'descartar' && nota.length < 5) return errorEn('eProp', 'Escribe por qué se descarta el ticket.');
  if (decision === 'aprobar' && !(p && p.huella)) return errorEn('eProp', 'No se pudo leer la propuesta. Cierra y vuelve a abrir el ticket.');
  errorEn('eProp', '');
  const base = '#' + t.ticket_id + ' · ' + t.titulo, ver = p ? '\nVersión ' + p.version + ' · ' + (ALCANCES[p.alcance] || p.alcance) : '';
  const que = {
    aprobar: ['¿Aprobar esta propuesta?', base + ver + (p && p.archivo_migracion ? '\nMigración: ' + p.archivo_migracion : '') + '\n\n' +
              (p && p.alcance === 'sin_cambio' ? 'Esta propuesta no cambia código: al aprobar, el ticket pasa a Publicado con esta explicación.'
                : 'Al aprobar, Opus publica en producción exactamente el código que acabas de ver, corre la prueba y pasa el ticket a Publicado. Si algo falla, se detiene y avisa.') +
              (nota ? '\n\nNota: ' + nota : ''), p && p.alcance === 'sin_cambio' ? 'Sí, aprobar' : 'Sí, aprobar y publicar'],
    rechazar: ['¿Pedir otra propuesta?', base + ver + '\n\nEsta propuesta no se publica. Claude prepara otra con tu nota:\n' + nota, 'Sí, pedir otra'],
    reintentar: ['¿Reintentar este ticket?', base + '\n\nVuelve a Aceptado y Claude lo toma otra vez.' + (nota ? '\n\nNota: ' + nota : ''), 'Sí, reintentar'],
    descartar: ['¿Descartar este ticket?', base + '\n\nEl ticket queda Rechazado y no se publica nada.\nMotivo: ' + nota, 'Sí, descartar']
  }[decision];
  if (!que) return;
  confirmar(que[0], que[1], que[2], () => api('tk_decidir', { ticket_id: t.ticket_id, decision, nota, huella: decision === 'aprobar' ? p.huella : '' }));
}
function triage(decision) {
  const t = T.det.ticket, prio = val('tPrio'), nota = val('tNota');
  if (decision === 'aceptar' && !prio) return errorEn('eTriage', 'Para aceptar elige la prioridad.');
  if (decision === 'rechazar' && nota.length < 5) return errorEn('eTriage', 'Para rechazar escribe el motivo.');
  errorEn('eTriage', '');
  confirmar(decision === 'aceptar' ? '¿Aceptar este ticket?' : '¿Rechazar este ticket?',
    '#' + t.ticket_id + ' · ' + t.titulo + (decision === 'aceptar' ? '\nPrioridad: ' + PRIOS[prio] : '') + (nota ? '\nNota: ' + nota : ''),
    decision === 'aceptar' ? 'Sí, aceptar' : 'Sí, rechazar',
    () => api('tk_triage', { ticket_id: t.ticket_id, decision, prioridad: prio, nota }));
}
function cambiarEstado() {
  const t = T.det.ticket, estado = val('sEstado'), nota = val('sNota'), issue = val('sIssue'), pr = val('sPr');
  if (!estado) return errorEn('eEstado', 'Elige a qué estado pasa.');
  if ((issue && !/^[0-9]{1,7}$/.test(issue)) || (pr && !/^[0-9]{1,7}$/.test(pr))) return errorEn('eEstado', 'El issue y el PR van como número, sin el signo #.');
  errorEn('eEstado', '');
  confirmar('¿Guardar el avance?', '#' + t.ticket_id + ' · ' + t.titulo + '\nPasa a: ' + (estado === 'nuevo' ? 'Nuevo (reabierto)' : ESTADOS[estado]) +
    (issue ? '\nIssue #' + issue : '') + (pr ? '\nPR #' + pr : '') + (nota ? '\nNota: ' + nota : ''), 'Sí, guardar',
    () => api('tk_estado', { ticket_id: t.ticket_id, estado, nota, issue_numero: issue, pr_numero: pr }));
}
function guardarNota() {
  const t = T.det.ticket, nota = val('dNota');
  if (nota.length < 2) return errorEn('eNota', 'Escribe la nota.');
  errorEn('eNota', '');
  confirmar('¿Agregar esta nota?', '#' + t.ticket_id + ' · ' + t.titulo + '\n\n' + nota, 'Sí, agregar', () => api('tk_nota', { ticket_id: t.ticket_id, nota }));
}
/* Texto listo para la plantilla "Ticket del portal" de GitHub. No se manda solo: la persona lo revisa y lo pega. */
function textoGitHub(t, nCap) {
  return '**Ticket del portal:** ' + t.ticket_id + '\n\n**Módulo y pantalla:** ' + (MODS[t.modulo] || t.modulo) + (t.pantalla ? ' · ' + t.pantalla : '') +
    '\n\n**Tipo:** ' + (TIPOS[t.tipo] || t.tipo) + '\n\n## Qué pasa hoy y qué debería pasar\n\n' + t.descripcion +
    '\n\n## Pasos para reproducirlo\n\n' + (t.pasos || '(sin pasos)') +
    /* Las capturas nunca se copian (11-nov-2026): el repositorio es público. Solo se dice cuántas hay, para describirlas con palabras. */
    (nCap ? '\n\n**Capturas:** ' + nCap + ' en el portal. No se copian a GitHub: describe aquí lo que muestran, sin datos reales.' : '') +
    '\n\n## Alcance\n\n- Riesgo: bajo / alto\n- ¿Necesita un dato o una acción nueva del servidor?: no / sí (cuál)\n\n' +
    '@claude implementa este ticket siguiendo `.claude/CLAUDE.md`.';
}
async function copiarParaGitHub() {
  const txt = textoGitHub(T.det.ticket, (T.det.capturas || []).length);
  try { await navigator.clipboard.writeText(txt); errorEn('eEstado', ''); aviso('Texto copiado. Revísalo y quita nombres, correos y montos antes de pegarlo en GitHub.'); }
  catch (e) { errorEn('eEstado', 'El navegador no dejó copiar. Selecciona el texto del ticket y cópialo a mano.'); }
}

/* ── Capturas de pantalla (11-nov-2026, Sergio): opcionales, para enseñar el error. El servidor dice si se ofrecen y con qué
   límites (tk_inicio → capturas); si no lo dice, la pantalla queda como antes. La imagen se queda en el servidor y solo la
   ven quien levantó el ticket y administración. Aquí solo se reduce para que quepa en el peso que pide el servidor. ── */
function capLim() { const c = T.ini && T.ini.capturas; return (c && Number(c.max_por_ticket) > 0 && Number(c.max_kb) > 0) ? c : null; }
/* La imagen solo viaja por SQL Connect (issue #13). api() pasa al respaldo de n8n cuando SQL Connect falla, y n8n guarda en su
   historial lo que recibe; por eso subir una captura no usa api(): si SQL Connect no está o no responde, la imagen no se manda por
   otro camino y se avisa. Usa la sesión que api() ya dejó abierta: no inicia sesión. Solo si el servidor apaga la regla
   (capturas.solo_sql_connect = false) sube con api(), como cualquier otra acción. (11-nov-2026) */
async function subirCaptura(d) {
  const lim = capLim(), no = t => ({ error: 'solo_sql_connect', detalle: 'Las capturas solo viajan por la conexión segura del portal, y en este momento ' + t + '. Vuelve a cargar la página e inténtalo de nuevo.' });
  let r;
  if (lim && lim.solo_sql_connect === false) r = await api('tk_captura_subir', d);
  else {
    try {
      await esperarLEMDC();
      const u = window.LEMDC && LEMDC.usuario(), em = emailDeToken(S.token);
      if (!u || (em && (u.email || '').toLowerCase() !== em)) return no('no está disponible');
      r = await LEMDC.llamar('tk_captura_subir', d);
    } catch (e) { return no('no respondió (' + String((e && (e.message || e.code)) || 'sin respuesta').slice(0, 120) + ')'); }
  }
  return (r && (r.ok || r.error)) ? r : { error: 'sin_respuesta', detalle: 'El servidor respondió vacío. Cierra, revisa si la captura quedó en el ticket y, si no, vuelve a agregarla.' };
}
/* capGen cambia cada vez que se abre o se cierra un formulario: una imagen que todavía se estaba reduciendo para el formulario
   anterior se descarta y nunca pasa a otro ticket (11-nov-2026, revisión de Codex en el PR #14). capPend: cuántas se están preparando. */
function capSoltar() { for (const u of T.urls) { try { URL.revokeObjectURL(u); } catch (e) {} } T.urls = []; T.caps = []; T.capGen++; T.capPend = 0; }
function capUrl(blob) { const u = URL.createObjectURL(blob); T.urls.push(u); return u; }
function capB64(blob) { return new Promise((ok, mal) => { const fr = new FileReader(); fr.onload = () => ok(String(fr.result).replace(/^data:[^,]*,/, '')); fr.onerror = () => mal(new Error('No se pudo leer la imagen.')); fr.readAsDataURL(blob); }); }
function capImagen(blob) { return new Promise((ok, mal) => { const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); ok(im); }; im.onerror = () => { URL.revokeObjectURL(u); mal(new Error('Ese archivo no es una imagen que se pueda abrir.')); }; im.src = u; }); }
/* Deja la imagen lista para mandar. Si ya cabe, va tal cual; si no, se pasa a JPG y se va achicando hasta que quepa. */
async function capPreparar(file) {
  const lim = capLim(), tope = Number(lim.max_kb) * 1024, tipos = lim.tipos || [];
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) throw new Error('Solo se aceptan imágenes JPG, PNG o WebP.');
  let blob = file, nombre = String(file.name || 'captura');
  if (file.size > tope || !tipos.includes(file.type)) {
    const im = await capImagen(file); blob = null;
    for (const [lado, calidad] of [[1600, .85], [1600, .7], [1280, .7], [1024, .6], [800, .5]]) {
      const f = Math.min(1, lado / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.naturalWidth * f)); c.height = Math.max(1, Math.round(im.naturalHeight * f));
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', calidad));
      if (b && b.size <= tope) { blob = b; break; }
    }
    if (!blob) throw new Error('No se pudo reducir la imagen a ' + lim.max_kb + ' KB. Recorta la captura a la parte que importa.');
    nombre = nombre.replace(/\.[A-Za-z0-9]+$/, '') + '.jpg';
  }
  return { nombre: nombre.slice(0, 120), datos: await capB64(blob), url: capUrl(blob) };
}
/* Formulario de ticket nuevo: las capturas esperan aquí hasta que se confirma el ticket */
function capPintar() {
  const el = $('nCaps'); if (!el) return;
  el.innerHTML = T.caps.map((c, i) => '<div class="cap"><img src="' + esc(c.url) + '" alt=""><span>' + esc(c.nombre) + '</span><button type="button" onclick="capQuitarLocal(' + i + ')">Quitar</button></div>').join('') +
    (T.capPend ? '<div class="cap"><span>Preparando captura…</span></div>' : '');
}
function capQuitarLocal(i) { T.caps.splice(i, 1); capPintar(); }
async function capAgregar(archivos) {
  const lim = capLim(); if (!lim || !$('nCaps')) return;
  const gen = T.capGen;                                               // el formulario al que pertenecen estas imágenes
  errorEn('eNuevo', ''); T.capPend++; capPintar();
  try {
    for (const f of archivos) {
      if (gen !== T.capGen) return;                                   // ese formulario ya se cerró
      if (T.caps.length >= Number(lim.max_por_ticket)) { errorEn('eNuevo', 'Van ' + lim.max_por_ticket + ' capturas, que es el máximo por ticket.'); break; }
      let c; try { c = await capPreparar(f); } catch (e) { if (gen === T.capGen) errorEn('eNuevo', (e && e.message) || 'No se pudo usar esa imagen.'); continue; }
      if (gen !== T.capGen) return;                                   // se cerró mientras se reducía: la imagen no pasa a otro ticket
      if (T.caps.length < Number(lim.max_por_ticket)) T.caps.push(c);
      capPintar();
    }
  } finally { if (gen === T.capGen) { T.capPend--; capPintar(); } }
}
/* Detalle del ticket: ver, agregar y quitar. Agregar y quitar guardan, así que pasan por la confirmación. */
async function verCaptura(id) {
  const caja = $('capv' + id); if (!caja) return;
  if (caja.firstChild) { caja.textContent = ''; return; }             // segundo clic: la esconde
  errorEn('eCap', ''); caja.textContent = 'Cargando…';
  let r; try { r = await api('tk_captura', { captura_id: id }); } catch (e) { r = { error: 'conexion', detalle: 'No se pudo conectar. Reintenta.' }; }
  if ($('capv' + id) !== caja) return;                                // el detalle se cerró o se volvió a pintar
  caja.textContent = '';
  if (!r || r.error) return errorEn('eCap', (r && (r.detalle || r.error)) || 'Sin respuesta');
  if (!/^image\/(png|jpeg|webp)$/.test(r.tipo || '')) return errorEn('eCap', 'El servidor mandó un archivo que no es imagen.');
  try {
    const bin = atob(r.datos), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    const im = document.createElement('img'); im.alt = r.nombre || 'Captura'; im.src = capUrl(new Blob([a], { type: r.tipo })); caja.appendChild(im);
  } catch (e) { errorEn('eCap', 'No se pudo mostrar la imagen.'); }
}
function quitarCaptura(id) {
  const t = T.det.ticket, c = (T.det.capturas || []).find(x => Number(x.captura_id) === Number(id)); if (!c) return;
  errorEn('eCap', '');
  confirmar('¿Quitar esta captura?', '#' + t.ticket_id + ' · ' + t.titulo + '\n\n' + c.nombre + '\nSe borra del portal y no se puede recuperar.', 'Sí, quitar',
    () => api('tk_captura_quitar', { captura_id: c.captura_id }));
}
async function agregarCaptura(archivos) {
  const t = T.det && T.det.ticket, f = archivos && archivos[0]; if (!t || !f || !capLim()) return;
  const gen = T.capGen, b = $('bCap');
  errorEn('eCap', ''); if (b) { b.disabled = true; b.textContent = 'Preparando captura…'; }
  let c, falla = '';
  try { c = await capPreparar(f); } catch (e) { falla = (e && e.message) || 'No se pudo usar esa imagen.'; }
  if (gen !== T.capGen || !T.det || T.det.ticket.ticket_id !== t.ticket_id) return;   // el detalle se cerró o cambió mientras se reducía
  if (b && $('bCap') === b) { b.disabled = false; b.textContent = 'Agregar captura'; }
  if (falla) return errorEn('eCap', falla);
  /* Si mientras se reducía se abrió otra confirmación (una nota, el triage…), no se reemplaza: esa acción sigue su curso y la
     captura se vuelve a elegir después (11-nov-2026, revisión de Codex en el PR #14) */
  if (T.guardando || !$('conf').hidden) return errorEn('eCap', 'La captura no se agregó porque había otra confirmación abierta. Termina esa acción y vuelve a elegirla.');
  confirmar('¿Agregar esta captura?', '#' + t.ticket_id + ' · ' + t.titulo + '\n\n' + c.nombre, 'Sí, agregar',
    () => subirCaptura({ ticket_id: t.ticket_id, nombre: c.nombre, datos: c.datos }));
}
/* Pegar con Cmd+V: en el ticket nuevo se suma a la lista; en el detalle abre la confirmación. El texto pegado no se toca. */
document.addEventListener('paste', e => {
  if (!capLim() || T.guardando || !$('conf').hidden || $('modal').hidden) return;
  const fs = [...((e.clipboardData && e.clipboardData.files) || [])].filter(f => /^image\//.test(f.type));
  if (!fs.length) return;
  if ($('nCaps')) { e.preventDefault(); capAgregar(fs); }
  else if ($('dArch')) { e.preventDefault(); if (!($('bCap') || {}).disabled) agregarCaptura(fs); }   // una a la vez
});

async function arrancar() {
  $('app').innerHTML = '<div class="msg">Cargando tickets…</div>';
  try {
    const r = await api('tk_inicio');
    if (r && r.error) {
      if (r.error === 'sin_acceso') return vSinAcceso(r.detalle || 'No tienes acceso al módulo de Tickets.');
      if (r.error === 'accion_desconocida') return vSinAcceso('El módulo de Tickets todavía no está activado en el servidor.');
      return vSinAcceso('No se pudieron cargar los tickets: ' + (r.detalle || r.error));
    }
    T.ini = r; pintar();
  } catch (e) {
    store.del(); S.token = null; if (window.LEMDC) LEMDC.salir();
    vLogin(e && e.expirada ? 'Tu sesión expiró — vuelve a entrar.' : 'No se pudo conectar (' + ((e && e.message) || 'error') + '). Reintenta.');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('conf').hidden) cerrarConf(); else if (!$('modal').hidden) cerrarModal(); } });
if (S.token) arrancar(); else vLogin();
</script>
