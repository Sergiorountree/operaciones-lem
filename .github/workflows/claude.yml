name: Claude Code (LEM PRO)

# Responde a "@claude" en issues, comentarios y revisiones, solo si lo escribe una cuenta autorizada.
# Claude (Opus 5.5) trabaja en una rama y este workflow abre el pull request.
# Nada se publica solo: mergear a main lo hace una persona.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Cuentas que pueden despertar a Claude. Agregar aquí a quien se autorice después.
    if: |
      contains(fromJSON('["Sergiorountree","grupolem-lempro"]'), github.actor) &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40

      # La Action deja el trabajo en una rama claude/issue-<n>-...; aquí se abre el PR.
      # Con el secreto LEMPRO_GH_TOKEN lo abre la cuenta máquina; sin él, lo abre el token del workflow.
      - name: Abrir el pull request
        if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
        env:
          GH_TOKEN: ${{ secrets.LEMPRO_GH_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH=$(git ls-remote --heads origin "claude/issue-${ISSUE_NUMBER}-*" | awk '{print $2}' | sed 's#refs/heads/##' | sort | tail -n 1)
          if [ -z "$BRANCH" ]; then
            echo "Claude no dejó una rama para el issue #${ISSUE_NUMBER}; no hay PR que abrir."
            exit 0
          fi
          ABIERTOS=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$ABIERTOS" != "0" ]; then
            echo "Ya hay un PR abierto para ${BRANCH}."
            exit 0
          fi
          # 9-nov-2026: el título y la descripción salen del comentario de Claude (su enlace "Create PR"),
          # que trae las cuatro secciones de .claude/CLAUDE.md; antes era un texto fijo.
          # "Closes #n" hace que el issue se cierre solo al mergear.
          gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '[.[] | select(.user.login=="claude[bot]") | .body] | last // ""' > "$RUNNER_TEMP/comentario.md"
          python3 - "$ISSUE_NUMBER" "$RUNNER_TEMP/comentario.md" "$RUNNER_TEMP/titulo.txt" "$RUNNER_TEMP/cuerpo.md" <<'PY'
          import re, sys, urllib.parse
          numero, comentario, sal_titulo, sal_cuerpo = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          texto = open(comentario, encoding='utf-8').read()
          titulo, cuerpo = '', ''
          m = re.search(r'\]\((https://github\.com/\S+/compare/\S+)', texto)
          if m:
              url = m.group(1)
              if url.endswith(')'):
                  url = url[:-1]          # paréntesis que cierra el enlace de Markdown
              q = urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
              titulo = (q.get('title') or [''])[0].strip()
              cuerpo = (q.get('body') or [''])[0].strip()
          if not cuerpo:
              cuerpo = 'Rama escrita por Claude (Opus 5.5). Claude no dejó una descripción; revisar el diff completo.'
          if not re.search(r'(?i)\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#' + re.escape(numero) + r'\b', cuerpo):
              cuerpo += '\n\nCloses #' + numero
          cuerpo += '\n\n---\nPR abierto por la Action de Claude (Opus 5.5). No se publica hasta que una persona autorizada lo apruebe y lo mergee.'
          open(sal_titulo, 'w', encoding='utf-8').write(titulo)
          open(sal_cuerpo, 'w', encoding='utf-8').write(cuerpo + '\n')
          PY
          TITULO=$(cat "$RUNNER_TEMP/titulo.txt")
          if [ -z "$TITULO" ]; then
            TITULO=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title --jq .title)
          fi
          gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "$TITULO" \
            --body-file "$RUNNER_TEMP/cuerpo.md"
